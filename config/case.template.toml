# wrfkit case.toml template
#
# Purpose:
#   - one human-readable case description for data acquisition + common WPS/WRF settings;
#   - keep namelist.wps and namelist.input as the actual native files used by WPS/WRF;
#   - permit every native namelist option through [advanced.*] passthrough tables.
#
# TOML types map naturally to Fortran namelist values:
#   string -> 'string'       integer/float -> numeric value
#   true/false -> .true./.false.    array -> comma-separated namelist values
#
# Values shown below are examples, not universal scientific recommendations.
# WRF/WPS choices depend on domain, resolution, application, forcing, and physics.

schema_version = 1

[case]
# Free text for humans/provenance.
description = "Example real-data WRF case"

[namelist]
# true  = wrfctl config overlays TOML-owned values onto namelist.wps/input.
#         Native options not represented in TOML are left untouched.
# false = wrfkit treats both native namelists as read-only; TOML still controls
#         wrfkit-specific acquisition/workflow settings such as forcing.
managed = true

[time]
# UTC timestamps. real.exe uses start/end times; WPS uses the same window.
start = 2026-01-01T00:00:00Z
end   = 2026-01-02T00:00:00Z

# Seconds between external meteorological input times.
# This example uses a 3-hour forcing interval -> 10800 s. Choose an interval
# that matches the actual input times you acquire.
forcing_interval_seconds = 10800

[forcing]
# Current implemented provider/product. The schema is intentionally provider-
# oriented so ERA5/FNL/etc. can be added without changing WRF namelists.
provider = "gfs"
product = "0p25"

# GFS initialization cycle. Operational GFS cycles are 00/06/12/18 UTC.
cycle = 2026-01-01T00:00:00Z

# Forecast hours to acquire. Must cover every required WPS time.
forecast_hours = [0, 3, 6, 9, 12, 15, 18, 21, 24]

[forcing.subset]
# Regional NOMADS subset bounds. Longitudes follow the provider convention.
# Current GFS downloader uses 0..360 degrees east.
west  = 265.0
east  = 288.0
south = 25.0
north = 42.0

[geography]
# dataset tells wrfkit where the static geography comes from.
#
#   Minimal validation / education (downloaded by wrfkit):
#     dataset    = "wps-lowres-mandatory"
#     resolution = "lowres"
#
#   Research baseline (downloaded and cached by wrfkit):
#     dataset    = "wps-highres-mandatory"
#     resolution = "default"        # or another valid native WPS selector
#
#   User-provided geography:
#     dataset    = "external"
#     resolution = "default"
#     path       = "my-geog"        # <data_root>/geog/my-geog
#     path       = "/work/.../WPS_GEOG"  # absolute paths are also allowed
#
# resolution maps directly to native WPS geog_data_res. wrfkit keeps the
# low-resolution validation package restricted to "lowres", but does not reduce the
# normal WPS selector freedom for research/external geography.
dataset = "wps-lowres-mandatory"
resolution = "lowres"

[domain]
# Number of domains. Domain-dependent entries below are TOML arrays.
max_dom = 1

# WPS parent_id uses 1 for d01. wrfkit converts d01 to 0 for namelist.input.
parent_id = [1]

# For nests, WRF/WPS guidance commonly uses an odd ratio; 3 is a standard
# starting point and 3 or 5 are recommended by WPS best-practice guidance.
parent_grid_ratio = [1]
i_parent_start = [1]
j_parent_start = [1]

# Staggered horizontal grid dimensions.
e_we = [101]
e_sn = [101]

# Full vertical levels including surface and model top.
# There is no universal best value; choose for the scientific application.
e_vert = [45]

# Grid spacing in meters for Lambert/polar/mercator. For nests, you may use
# arrays in namelist.input, e.g. dx=[12000,4000], while WPS derives nest
# spacing from parent_grid_ratio.
dx = 12000
dy = 12000

# WPS projections: "lambert", "polar", "mercator", or "lat-lon".
map_proj = "lambert"
ref_lat = 33.95
ref_lon = -83.38
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -84.0

[model]
# WRF integration time step in seconds.
# Official guidance for typical real-data cases is <= 6 * dx(km).
# Example: 12-km d01 -> 72 s is the upper-rule-of-thumb value; CFL issues
# often require a smaller value.
time_step = 72

[physics]
# WRF 4.8 supports physics suites including "CONUS" and "tropical".
# A suite is a coherent preset, not a universal recommendation.
# Remove/comment this key if you prefer to set individual schemes below.
suite = "CONUS"

[output]
# History output interval in minutes. 60 is a common WRF example/default;
# choose based on the temporal resolution needed by the study.
history_interval_minutes = 60

# Number of output times stored in each wrfout file.
frames_per_outfile = 1

# Set true for a restart integration and configure restart_interval_minutes.
restart = false
# restart_interval_minutes = 1440

# ---------------------------------------------------------------------------
# ADVANCED NATIVE NAMELIST OVERRIDES
# ---------------------------------------------------------------------------
# Any table under [advanced.wps.<group>] maps directly to &<group> in
# namelist.wps. Any table under [advanced.wrf.<group>] maps directly to the
# same group in namelist.input. This is the escape hatch for *all* native
# WRF/WPS namelist variables, including future options wrfkit does not know.
#
# Advanced values override the convenience fields above when both address the
# same native variable. Unspecified native variables remain untouched.
#
# Uncomment only what you need. The values below illustrate commonly used
# controls and upstream defaults/recommendations; they are not one-size-fits-all.

# [advanced.wps.share]
# wrf_core = "ARW"
# active_grid = [true]

# [advanced.wps.geogrid]
# geog_data_res = ["default"]  # full-resolution research data normally uses "default"
# opt_geogrid_tbl_path = "."

# [advanced.wps.ungrib]
# out_format = "WPS"
# prefix = "FILE"

# [advanced.wps.metgrid]
# fg_name = ["FILE"]
# opt_metgrid_tbl_path = "."

# [advanced.wrf.time_control]
# input_from_file = [true]
# io_form_history = 2   # 2 = NetCDF
# io_form_restart = 2
# io_form_input = 2
# io_form_boundary = 2
# debug_level = 0

# [advanced.wrf.domains]
# time_step_fract_num = 0
# time_step_fract_den = 1
# p_top_requested = 5000        # Pa; common WRF real-data example
# num_metgrid_levels = 34       # must match the actual metgrid forcing
# num_metgrid_soil_levels = 4   # must match the actual metgrid forcing
# parent_time_step_ratio = [1]
# feedback = 1                  # 1 two-way; 0 one-way nesting
# smooth_option = 0             # WRF best-practice page typically recommends 0
# auto_levels_opt = 2
# dzbot = 50.0
# dzstretch_s = 1.3
# dzstretch_u = 1.1
# max_dz = 1000.0

# [advanced.wrf.physics]
# mp_physics = [-1]             # -1 lets physics_suite provide the scheme
# cu_physics = [-1]
# ra_lw_physics = [-1]
# ra_sw_physics = [-1]
# bl_pbl_physics = [-1]
# sf_sfclay_physics = [-1]
# sf_surface_physics = [-1]
# radt = [12]                   # guidance: roughly 1 min per km of d01 dx
# bldt = [0]                    # 0 = every model time step; recommended
# cudt = [0]                    # 0 = every model time step; recommended
# icloud = 1
# num_land_cat = 21
# sf_urban_physics = [0]
# fractional_seaice = 1

# [advanced.wrf.dynamics]
# hybrid_opt = 2
# w_damping = 0
# diff_opt = [2]
# km_opt = [4]
# diff_6th_opt = [0]
# diff_6th_factor = [0.12]
# base_temp = 290.0
# damp_opt = 3
# zdamp = [5000.0]
# dampcoef = 0.2
# non_hydrostatic = [true]
# moist_adv_opt = [1]
# scalar_adv_opt = [1]
# gwd_opt = [1]

# [advanced.wrf.bdy_control]
# spec_bdy_width = 5
# specified = [true]

# [advanced.wrf.namelist_quilt]
# nio_tasks_per_group = 0
# nio_groups = 1

# RAW ESCAPE HATCH
# ----------------
# If a future/special WRF option needs syntax that cannot be represented by the
# normal TOML -> Fortran conversion, use *_raw. The TOML string is inserted
# verbatim as the namelist value. Quoted keys permit indexed Fortran names.
#
# [advanced.wrf_raw.domains]
# "eta_levels(1:3)" = "1.0, 0.5, 0.0"
#
# [advanced.wps_raw.geogrid]
# some_future_option = "native_fortran_expression"
