# Default Sapelo2 rootless-Nix profile.
# Fast, disposable node-local store for single-node setup/build/test workflows.
profile=sapelo2
store_root=/lscratch/$USER/.nix
backend=auto

# Sapelo2 is a shared Slurm HPC environment. Bootstrap setup/build work should
# run inside an allocated compute context rather than on a login node.
scheduler=slurm
require_allocation=true

# Site-local disposable workspace for high-I/O temporary work.
# Persistent wrfkit state stays project-local by default.
scratch_root=/lscratch/$USER/wrfkit

# Runtime MPI policy. In batch jobs, auto uses SLURM_NTASKS. In an interactive
# srun shell, auto can use SLURM_CPUS_PER_TASK for the child MPI step.
mpi_launcher=srun
mpi_tasks=auto
