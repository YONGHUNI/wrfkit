# Default Sapelo2 rootless-Nix profile.
# Fast, disposable node-local store for single-node setup/build/test workflows.
profile=sapelo2
store_root=/lscratch/$USER/.nix
backend=auto

# Site-local disposable workspace for high-I/O temporary work.
# Persistent wrfkit state stays project-local by default.
scratch_root=/lscratch/$USER/wrfkit
