# Optional shared Sapelo2 rootless-Nix profile.
# Reusable across compute nodes, but /scratch remains temporary GACRC storage.
profile=sapelo2-shared
store_root=/scratch/$USER/.nix
backend=auto

scheduler=slurm
require_allocation=true

# Shared-store profile is suitable for later multi-node Slurm validation.
mpi_launcher=srun
mpi_tasks=auto
