site_name: wrfkit
site_description: Reproducible WRF/WPS environments and single-node HPC workflows
site_url: https://yonghuni.github.io/wrfkit/
repo_url: https://github.com/YONGHUNI/wrfkit
repo_name: YONGHUNI/wrfkit
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md

  - Get started:
      - Bootstrap and wrfkit shell: tutorials/bootstrap-and-shell.md
      - Your first WRF run: tutorials/first-run.md
      - UGA Sapelo2: single-node-guide.md

  - Workflow:
      - Make a research case: how-to/research-case.md
      - High-level and low-level workflow: how-to/low-level-workflow.md
      - Run WRF with sbatch: how-to/sapelo2-batch.md
      - Check whether a run succeeded: how-to/check-run.md
      - Troubleshooting: troubleshooting.md

  - Configuration:
      - Understand case.toml: reference/case-toml.md
      - Native WRF/WPS namelist options: reference/native-namelists.md
      - Customize flake.nix: how-to/customize-flake.md

  - Reference:
      - wrfctl commands: reference/commands.md
      - Files and folders: reference/files-and-folders.md
      - Glossary: reference/glossary.md
      - Supported and validated: validation.md

  - Internals:
      - How wrfkit works: explanation/how-it-works.md
      - Detailed notes:
          - Feature details: features.md
          - Caveats and safe patterns: caveats.md
          - Design notes: design.md
          - Validation notes: development/validation-notes.md
          - Documentation site: development/docs-site.md

copyright: "wrfkit documentation"
