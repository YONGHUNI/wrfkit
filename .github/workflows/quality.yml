name: quality

on:
  push:
  pull_request:

jobs:
  syntax-and-case-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n wrfctl bootstrap scripts/*.sh

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/*.py

      - name: Check terminal color policy
        run: |
          bash -c 'source scripts/ui.sh; ui_ok "plain"' > /tmp/plain
          WRFKIT_COLOR=always bash -c 'source scripts/ui.sh; ui_ok "colored"' > /tmp/color
          NO_COLOR=1 WRFKIT_COLOR=always bash -c 'source scripts/ui.sh; ui_ok "plain"' > /tmp/no-color

          python3 - <<'PY'
          from pathlib import Path
          assert 27 not in Path("/tmp/plain").read_bytes()
          assert 27 in Path("/tmp/color").read_bytes()
          assert 27 not in Path("/tmp/no-color").read_bytes()
          PY

      - name: Validate tracked TOML smoke case
        run: |
          python3 scripts/case-config.py config --case athens-smoke --check
          python3 scripts/case-config.py summary --case athens-smoke
          python3 scripts/case-config.py fingerprint --case athens-smoke

      - name: Check WRF decomposition planner
        run: |
          python3 scripts/case-config.py mpi-plan --case athens-smoke --requested 32 --shell > /tmp/mpi-plan
          cat /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_NPROC_X=4' /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_NPROC_Y=8' /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_SAFE=0' /tmp/mpi-plan
          grep -qx 'WRFKIT_WRF_TASKS=30' /tmp/mpi-plan
          grep -qx 'WRFKIT_NPROC_X=5' /tmp/mpi-plan
          grep -qx 'WRFKIT_NPROC_Y=6' /tmp/mpi-plan

      - name: Check TOML renderer idempotence
        run: |
          python3 scripts/case-config.py config --case athens-smoke
          git diff --exit-code -- \
            cases/athens-smoke/namelist.wps \
            cases/athens-smoke/namelist.input

      - name: Check prep-manifest warn-and-continue policy
        run: |
          export WRFKIT_NIX_SHELL=1
          export WRFKIT_WRF_VERSION=4.8.0
          export WRFKIT_WPS_VERSION=4.7.0
          source scripts/lib.sh

          mkdir -p .wrfkit/work/athens-smoke
          cp cases/athens-smoke/case.toml /tmp/case.toml
          cp cases/athens-smoke/namelist.input /tmp/namelist.input
          trap 'cp /tmp/case.toml cases/athens-smoke/case.toml; cp /tmp/namelist.input cases/athens-smoke/namelist.input' EXIT

          write_prep_manifest athens-smoke

          sed -i 's/history_interval_minutes = 180/history_interval_minutes = 181/' cases/athens-smoke/case.toml
          verify_prep_manifest athens-smoke 2>/tmp/case-warning
          test "$WRFKIT_PREP_CHANGED" -eq 1
          grep -q 'case.toml scientific configuration' /tmp/case-warning
          cp /tmp/case.toml cases/athens-smoke/case.toml

          printf '\n! CI stale-manifest warning test\n' >> cases/athens-smoke/namelist.input
          verify_prep_manifest athens-smoke 2>/tmp/namelist-warning
          test "$WRFKIT_PREP_CHANGED" -eq 1
          grep -q 'namelist.input' /tmp/namelist-warning
          cp /tmp/namelist.input cases/athens-smoke/namelist.input

          sed -i 's/^wrf_version=.*/wrf_version=0.0.0/' .wrfkit/work/athens-smoke/.wrfkit-prep-manifest
          if verify_prep_manifest athens-smoke 2>/tmp/version-error; then
            echo "WRF version mismatch unexpectedly passed" >&2
            exit 1
          fi
          grep -q 'WRF version changed after prep' /tmp/version-error
