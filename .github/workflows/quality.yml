name: quality

on:
  push:
  pull_request:

jobs:
  syntax-and-case-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n wrfctl bootstrap scripts/*.sh

      - name: Check Python syntax
        run: |
          python3 -m py_compile scripts/*.py

      - name: Check terminal color policy
        run: |
          bash -c 'source scripts/ui.sh; ui_ok "plain"' > /tmp/plain
          WRFKIT_COLOR=always bash -c 'source scripts/ui.sh; ui_ok "colored"' > /tmp/color
          NO_COLOR=1 WRFKIT_COLOR=always bash -c 'source scripts/ui.sh; ui_ok "plain"' > /tmp/no-color

          python3 - <<'PY'
          from pathlib import Path
          assert 27 not in Path("/tmp/plain").read_bytes()
          assert 27 in Path("/tmp/color").read_bytes()
          assert 27 not in Path("/tmp/no-color").read_bytes()
          PY

      - name: Validate tracked TOML cases
        run: |
          python3 scripts/case-config.py config --case athens-minimal --check
          python3 scripts/case-config.py summary --case athens-minimal
          python3 scripts/case-config.py fingerprint --case athens-minimal
          python3 scripts/case-config.py config --case athens-highres --check
          python3 scripts/case-config.py summary --case athens-highres
          python3 scripts/case-config.py fingerprint --case athens-highres

      - name: Check geography profile resolver
        run: |
          export WRFKIT_NIX_SHELL=1

          ./scripts/case-config.py env --case athens-minimal > /tmp/geog-minimal.env
          grep -qx 'GEOG_DATASET=wps-lowres-mandatory' /tmp/geog-minimal.env
          grep -qx 'GEOG_RESOLUTION=lowres' /tmp/geog-minimal.env
          grep -qx 'GEOG_MANAGEMENT=managed' /tmp/geog-minimal.env
          grep -qx 'GEOG_AUTO_ACQUIRE=1' /tmp/geog-minimal.env
          test "$(./scripts/case-config.py geography-path --case athens-minimal --data-root /tmp/wrfkit-data)" = "/tmp/wrfkit-data/geog/low-res-mandatory"

          cp -a cases/athens-highres cases/geog-profile-test
          trap 'rm -rf cases/geog-profile-test /tmp/geog-*.env /tmp/geog-invalid.*' EXIT

          ./scripts/case-config.py env --case athens-highres > /tmp/geog-highres.env
          grep -qx 'GEOG_DATASET=wps-highres-mandatory' /tmp/geog-highres.env
          grep -qx 'GEOG_RESOLUTION=default' /tmp/geog-highres.env
          grep -qx 'GEOG_MANAGEMENT=managed' /tmp/geog-highres.env
          grep -qx 'GEOG_AUTO_ACQUIRE=1' /tmp/geog-highres.env
          test "$(./scripts/case-config.py geography-path --case athens-highres --data-root /tmp/wrfkit-data)" = "/tmp/wrfkit-data/geog/high-res-mandatory"

          sed -i 's/resolution = "default"/resolution = "30s+default"/' cases/geog-profile-test/case.toml
          ./scripts/case-config.py config --case geog-profile-test --check
          ./scripts/case-config.py env --case geog-profile-test > /tmp/geog-highres.env
          grep -qx 'GEOG_DATASET=wps-highres-mandatory' /tmp/geog-highres.env
          grep -qx 'GEOG_RESOLUTION=30s+default' /tmp/geog-highres.env
          grep -qx 'GEOG_MANAGEMENT=managed' /tmp/geog-highres.env
          grep -qx 'GEOG_AUTO_ACQUIRE=1' /tmp/geog-highres.env
          test "$(./scripts/case-config.py geography-path --case geog-profile-test --data-root /tmp/wrfkit-data)" = "/tmp/wrfkit-data/geog/high-res-mandatory"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("cases/geog-profile-test/case.toml")
          text = p.read_text()
          text = text.replace(
              'dataset = "wps-highres-mandatory"\nresolution = "30s+default"',
              'dataset = "external"\nresolution = "30s+default"\npath = "custom/geog"',
          )
          p.write_text(text)
          PY
          ./scripts/case-config.py config --case geog-profile-test --check
          ./scripts/case-config.py env --case geog-profile-test > /tmp/geog-external.env
          grep -qx 'GEOG_DATASET=external' /tmp/geog-external.env
          grep -qx 'GEOG_MANAGEMENT=external' /tmp/geog-external.env
          grep -qx 'GEOG_PATH_SPEC=custom/geog' /tmp/geog-external.env
          test "$(./scripts/case-config.py geography-path --case geog-profile-test --data-root /tmp/wrfkit-data)" = "/tmp/wrfkit-data/geog/custom/geog"

          sed -i 's|path = "custom/geog"|path = "/otherfs/shared/WPS_GEOG"|' cases/geog-profile-test/case.toml
          test "$(./scripts/case-config.py geography-path --case geog-profile-test --data-root /tmp/wrfkit-data)" = "/otherfs/shared/WPS_GEOG"

          sed -i '/^path = /d' cases/geog-profile-test/case.toml
          if ./scripts/case-config.py config --case geog-profile-test --check > /tmp/geog-invalid.out 2> /tmp/geog-invalid.err; then
            echo "External geography without a path unexpectedly passed validation" >&2
            exit 1
          fi
          grep -q 'geography.path is required' /tmp/geog-invalid.err

      - name: Check high-resolution geography downloader with local fixture
        run: |
          export WRFKIT_NIX_SHELL=1
          export WRFKIT_WRF_VERSION=4.8.0
          export WRFKIT_WPS_VERSION=4.7.0
          export WRFKIT_STATE_DIR=/tmp/wrfkit-geog-state
          export WRFKIT_DATA_DIR=/tmp/wrfkit-geog-data

          fixture=/tmp/wrfkit-geog-fixture/WPS_GEOG_HIGH_RES
          archive=/tmp/geog_high_res_mandatory.tar.gz
          rm -rf /tmp/wrfkit-geog-fixture "$WRFKIT_STATE_DIR" "$WRFKIT_DATA_DIR" "$archive"
          mkdir -p "$fixture"

          for d in \
            albedo_modis greenfrac_fpar_modis lai_modis_10m lai_modis_30s \
            maxsnowalb_modis modis_landuse_20class_30s_with_lakes \
            orogwd_2deg orogwd_1deg orogwd_30m orogwd_20m orogwd_10m \
            soiltemp_1deg soiltype_bot_30s soiltype_top_30s \
            topo_gmted2010_30s varsso varsso_10m varsso_5m varsso_2m
          do
            mkdir -p "$fixture/$d"
            printf 'fixture\n' > "$fixture/$d/index"
          done

          tar -czf "$archive" -C /tmp/wrfkit-geog-fixture WPS_GEOG_HIGH_RES

          WRFKIT_GEOG_URL="file://$archive" ./scripts/fetch-geog.sh --case athens-highres

          target="$WRFKIT_DATA_DIR/geog/high-res-mandatory"
          test -d "$target/topo_gmted2010_30s"
          test -d "$target/modis_landuse_20class_30s_with_lakes"
          grep -qx 'dataset=wps-highres-mandatory' "$target/.wrfkit-geog-source"
          test -s "$WRFKIT_DATA_DIR/geog/.archives/geog_high_res_mandatory.tar.gz"

          # A second fetch must reuse the complete installation.
          WRFKIT_GEOG_URL="file://$archive" ./scripts/fetch-geog.sh --case athens-highres

      - name: Check WRF decomposition planner
        run: |
          python3 scripts/case-config.py mpi-plan --case athens-minimal --requested 32 --shell > /tmp/mpi-plan
          cat /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_NPROC_X=4' /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_NPROC_Y=8' /tmp/mpi-plan
          grep -qx 'WRFKIT_REQUESTED_SAFE=0' /tmp/mpi-plan
          grep -qx 'WRFKIT_WRF_TASKS=30' /tmp/mpi-plan
          grep -qx 'WRFKIT_NPROC_X=5' /tmp/mpi-plan
          grep -qx 'WRFKIT_NPROC_Y=6' /tmp/mpi-plan

      - name: Check TOML renderer idempotence
        run: |
          python3 scripts/case-config.py config --case athens-minimal
          python3 scripts/case-config.py config --case athens-highres
          git diff --exit-code -- \
            cases/athens-minimal/namelist.wps \
            cases/athens-minimal/namelist.input \
            cases/athens-highres/namelist.wps \
            cases/athens-highres/namelist.input

      - name: Check prep-manifest warn-and-continue policy
        run: |
          export WRFKIT_NIX_SHELL=1
          export WRFKIT_WRF_VERSION=4.8.0
          export WRFKIT_WPS_VERSION=4.7.0
          source scripts/lib.sh

          mkdir -p .wrfkit/work/athens-minimal
          cp cases/athens-minimal/case.toml /tmp/case.toml
          cp cases/athens-minimal/namelist.input /tmp/namelist.input
          trap 'cp /tmp/case.toml cases/athens-minimal/case.toml; cp /tmp/namelist.input cases/athens-minimal/namelist.input' EXIT

          write_prep_manifest athens-minimal

          sed -i 's/history_interval_minutes = 180/history_interval_minutes = 181/' cases/athens-minimal/case.toml
          verify_prep_manifest athens-minimal 2>/tmp/case-warning
          test "$WRFKIT_PREP_CHANGED" -eq 1
          grep -q 'case.toml scientific configuration' /tmp/case-warning
          cp /tmp/case.toml cases/athens-minimal/case.toml

          printf '\n! CI stale-manifest warning test\n' >> cases/athens-minimal/namelist.input
          verify_prep_manifest athens-minimal 2>/tmp/namelist-warning
          test "$WRFKIT_PREP_CHANGED" -eq 1
          grep -q 'namelist.input' /tmp/namelist-warning
          cp /tmp/namelist.input cases/athens-minimal/namelist.input

          sed -i 's/^wrf_version=.*/wrf_version=0.0.0/' .wrfkit/work/athens-minimal/.wrfkit-prep-manifest
          if verify_prep_manifest athens-minimal 2>/tmp/version-error; then
            echo "WRF version mismatch unexpectedly passed" >&2
            exit 1
          fi
          grep -q 'WRF version changed after prep' /tmp/version-error
