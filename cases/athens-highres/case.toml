# wrfkit case configuration for Athens high-resolution geography validation.
schema_version = 1

[case]
description = "Athens, Georgia high-resolution mandatory geography validation case"

[namelist]
# true: case.toml owns only the fields it specifies; other native namelist
# fields are preserved. false: wrfkit never modifies namelist.wps/input.
managed = true

[time]
start = 2026-09-30T00:00:00Z
end = 2026-09-30T06:00:00Z
forcing_interval_seconds = 10800

[forcing]
provider = "gfs"
product = "0p25"
cycle = 2026-09-30T00:00:00Z
forecast_hours = [0, 3, 6]

[forcing.subset]
west = 265
east = 288
north = 42
south = 25

[geography]
dataset = "wps-highres-mandatory"
resolution = "default"

[domain]
max_dom = 1
parent_id = [1]
parent_grid_ratio = [1]
i_parent_start = [1]
j_parent_start = [1]
e_we = [61]
e_sn = [61]
e_vert = [45]
dx = 12000
dy = 12000
map_proj = "lambert"
ref_lat = 33.95
ref_lon = -83.38
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -84.0

[model]
time_step = 72

[physics]
suite = "CONUS"

[output]
history_interval_minutes = 180
frames_per_outfile = 1
restart = false
