# wrfkit case configuration for Athens convection-permitting high-resolution validation.
schema_version = 1

[case]
description = "Athens, Georgia 3-km convection-permitting high-resolution validation case"

[namelist]
# true: case.toml owns only the fields it specifies; other native namelist
# fields are preserved. false: wrfkit never modifies namelist.wps/input.
managed = true

[time]
start = 2026-09-30T00:00:00Z
end = 2026-09-30T06:00:00Z
forcing_interval_seconds = 10800

[forcing]
provider = "gfs"
product = "0p25"
cycle = 2026-09-30T00:00:00Z
forecast_hours = [0, 3, 6]

[forcing.subset]
west = 265
east = 288
north = 42
south = 25

[geography]
dataset = "wps-highres-mandatory"
resolution = "default"

[domain]
max_dom = 1
parent_id = [1]
parent_grid_ratio = [1]
i_parent_start = [1]
j_parent_start = [1]

# Keep approximately the same physical footprint as the 12-km 61x61
# validation domain: 60*12 km = 240*3 km = 720 km.
e_we = [241]
e_sn = [241]
e_vert = [45]
dx = 3000
dy = 3000
map_proj = "lambert"
ref_lat = 33.95
ref_lon = -83.38
truelat1 = 30.0
truelat2 = 60.0
stand_lon = -84.0

[model]
# WRF guidance uses <= 6 * dx(km) as a typical upper rule of thumb.
time_step = 18

[physics]
suite = "CONUS"

# At 3-km grid spacing, explicitly resolve deep convection instead of using
# the CONUS suite's default cumulus parameterization. Radiation is called
# every ~1 minute per km of d01 grid spacing.
[advanced.wrf.physics]
cu_physics = [0]
radt = [3]

[output]
history_interval_minutes = 180
frames_per_outfile = 1
restart = false
